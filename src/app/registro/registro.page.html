<ion-header>
  <ion-toolbar color="secondary">
    <ion-title>Registro de alumno</ion-title>
    <ion-button slot="end" href="home">Inicio</ion-button>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <h2>Ingresa tus datos</h2>
  <ion-list>
    <ion-item>
      <ion-input 
        label="Nombre completo" 
        labelPlacement="floating" 
        [(ngModel)]="usuario.nombre" 
        type="text">
      </ion-input>
    </ion-item>

    <ion-item>
      <ion-input 
        label="Número de control" 
        labelPlacement="floating" 
        [(ngModel)]="usuario.matricula" 
        type="text">
      </ion-input>
    </ion-item>

    <ion-item>
      <ion-input 
        label="Correo escolar" 
        labelPlacement="floating" 
        [(ngModel)]="usuario.correo" 
        type="text">
      </ion-input>
    </ion-item>
  </ion-list>
  <ion-button (click)="guardarDatos()">Guardar</ion-button>
</ion-content>
